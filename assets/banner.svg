<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0099CC"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9D4EDD"/>
      <stop offset="100%" style="stop-color:#7B2CBF"/>
    </linearGradient>
    <filter id="glowBanner">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bannerBg)"/>
  
  <!-- Decorative Lines -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="50" x2="1200" y2="50" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#9D4EDD" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="250" x2="1200" y2="250" stroke="#9D4EDD" stroke-width="1" opacity="0.3"/>
  
  <!-- Hexagon Pattern -->
  <g opacity="0.1">
    <polygon points="100,150 120,135 120,165" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <polygon points="150,150 170,135 170,165" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <polygon points="1050,150 1070,135 1070,165" fill="none" stroke="#9D4EDD" stroke-width="1"/>
    <polygon points="1100,150 1120,135 1120,165" fill="none" stroke="#9D4EDD" stroke-width="1"/>
  </g>
  
  <!-- N Logo -->
  <g transform="translate(100, 50)" filter="url(#glowBanner)">
    <text x="0" y="120" font-family="Arial Black, sans-serif" font-size="180" font-weight="bold" fill="url(#neonCyan)">N</text>
  </g>
  
  <!-- OVA Text -->
  <g transform="translate(280, 50)" filter="url(#glowText)">
    <text x="0" y="120" font-family="Arial Black, sans-serif" font-size="180" font-weight="bold" fill="#fff">OVA</text>
  </g>
  
  <!-- OS Tag -->
  <g transform="translate(280, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#neonCyan)">OS</text>
  </g>
  
  <!-- Subtitle -->
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="24" fill="#888" text-anchor="middle">Ultra-Lightweight Android ROM</text>
  
  <!-- Feature Tags -->
  <g transform="translate(500, 200)">
    <rect x="0" y="-15" width="100" height="30" rx="15" fill="#FF6B6B" opacity="0.2"/>
    <text x="50" y="5" font-family="Arial" font-size="12" fill="#FF6B6B" text-anchor="middle">🎮 GAMING</text>
    
    <rect x="110" y="-15" width="120" height="30" rx="15" fill="#51CF66" opacity="0.2"/>
    <text x="170" y="5" font-family="Arial" font-size="12" fill="#51CF66" text-anchor="middle">📷 CREATOR</text>
    
    <rect x="240" y="-15" width="100" height="30" rx="15" fill="#9D4EDD" opacity="0.2"/>
    <text x="290" y="5" font-family="Arial" font-size="12" fill="#9D4EDD" text-anchor="middle">⚡ LIGHT</text>
  </g>
  
  <!-- Version Badge -->
  <g transform="translate(1050, 250)">
    <rect x="-50" y="-20" width="100" height="40" rx="20" fill="url(#neonCyan)" opacity="0.2"/>
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" fill="#00D4FF" text-anchor="middle">v1.0.0</text>
  </g>
</svg>
