<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00D4FF" text-anchor="middle" filter="url(#glow2)">NOVA OS Key Features</text>
  
  <!-- Gaming Section -->
  <rect x="30" y="60" width="360" height="200" rx="15" fill="#1e1e2e" stroke="#FF6B6B" stroke-width="2"/>
  <text x="210" y="85" font-family="Arial" font-size="18" font-weight="bold" fill="#FF6B6B" text-anchor="middle">🎮 GAMING</text>
  
  <!-- Game Space -->
  <circle cx="70" cy="120" r="25" fill="#2d2d44"/>
  <text x="70" y="125" font-family="Arial" font-size="20" fill="#FF6B6B" text-anchor="middle">⚡</text>
  <text x="110" y="115" font-family="Arial" font-size="13" fill="#fff">Game Space</text>
  <text x="110" y="130" font-family="Arial" font-size="10" fill="#888">Auto resource allocation</text>
  
  <!-- Touch -->
  <circle cx="70" cy="175" r="25" fill="#2d2d44"/>
  <text x="70" y="180" font-family="Arial" font-size="20" fill="#FF6B6B" text-anchor="middle">👆</text>
  <text x="110" y="170" font-family="Arial" font-size="13" fill="#fff">1000Hz Touch</text>
  <text x="110" y="185" font-family="Arial" font-size="10" fill="#888">&lt;20ms input latency</text>
  
  <!-- Thermal -->
  <circle cx="70" cy="230" r="25" fill="#2d2d44"/>
  <text x="70" y="235" font-family="Arial" font-size="20" fill="#FF6B6B" text-anchor="middle">🌡️</text>
  <text x="110" y="225" font-family="Arial" font-size="13" fill="#fff">Thermal Mgmt</text>
  <text x="110" y="240" font-family="Arial" font-size="10" fill="#888">60fps locked</text>
  
  <!-- Creator Section -->
  <rect x="410" y="60" width="360" height="200" rx="15" fill="#1e1e2e" stroke="#51CF66" stroke-width="2"/>
  <text x="590" y="85" font-family="Arial" font-size="18" font-weight="bold" fill="#51CF66" text-anchor="middle">📷 CREATOR</text>
  
  <!-- Camera -->
  <circle cx="450" cy="120" r="25" fill="#2d2d44"/>
  <text x="450" y="125" font-family="Arial" font-size="20" fill="#51CF66" text-anchor="middle">📸</text>
  <text x="490" y="115" font-family="Arial" font-size="13" fill="#fff">Camera2 API L3</text>
  <text x="490" y="130" font-family="Arial" font-size="10" fill="#888">GCam compatible</text>
  
  <!-- Screen Record -->
  <circle cx="450" cy="175" r="25" fill="#2d2d44"/>
  <text x="450" y="180" font-family="Arial" font-size="20" fill="#51CF66" text-anchor="middle">🎬</text>
  <text x="490" y="170" font-family="Arial" font-size="13" fill="#fff">60fps Recorder</text>
  <text x="490" y="185" font-family="Arial" font-size="10" fill="#888">Internal audio</text>
  
  <!-- I/O -->
  <circle cx="450" cy="230" r="25" fill="#2d2d44"/>
  <text x="450" y="235" font-family="Arial" font-size="20" fill="#51CF66" text-anchor="middle">💾</text>
  <text x="490" y="225" font-family="Arial" font-size="13" fill="#fff">I/O Optimized</text>
  <text x="490" y="240" font-family="Arial" font-size="10" fill="#888">300MB/s+ read</text>
  
  <!-- System Section -->
  <rect x="30" y="280" width="740" height="100" rx="15" fill="#1e1e2e" stroke="#9D4EDD" stroke-width="2"/>
  <text x="400" y="305" font-family="Arial" font-size="18" font-weight="bold" fill="#9D4EDD" text-anchor="middle">⚡ SYSTEM OPTIMIZATION</text>
  
  <!-- ZRAM -->
  <rect x="60" y="320" width="160" height="50" rx="8" fill="#2d2d44"/>
  <text x="140" y="342" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle">ZRAM LZ4HC</text>
  <text x="140" y="358" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">2:1 Compression</text>
  
  <!-- LMKD -->
  <rect x="240" y="320" width="160" height="50" rx="8" fill="#2d2d44"/>
  <text x="320" y="342" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle">LMKD Tuned</text>
  <text x="320" y="358" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Aggressive Swap</text>
  
  <!-- Debloat -->
  <rect x="420" y="320" width="160" height="50" rx="8" fill="#2d2d44"/>
  <text x="500" y="342" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle">Zero Bloat</text>
  <text x="500" y="358" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">-2.7GB Removed</text>
  
  <!-- Boot -->
  <rect x="600" y="320" width="160" height="50" rx="8" fill="#2d2d44"/>
  <text x="680" y="342" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle">Fast Boot</text>
  <text x="680" y="358" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">&lt;15 seconds</text>
  
  <!-- Performance Metrics -->
  <rect x="30" y="400" width="740" height="85" rx="15" fill="#1e1e2e" stroke="#FFD43B" stroke-width="2"/>
  <text x="400" y="420" font-family="Arial" font-size="16" font-weight="bold" fill="#FFD43B" text-anchor="middle">📊 PERFORMANCE TARGETS</text>
  
  <text x="120" y="445" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">RAM: &lt;1.8GB</text>
  <text x="120" y="460" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">Idle Usage</text>
  
  <text x="300" y="445" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">Storage: ~800MB</text>
  <text x="300" y="460" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">ROM Size</text>
  
  <text x="500" y="445" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">Touch: &lt;20ms</text>
  <text x="500" y="460" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">Latency</text>
  
  <text x="680" y="445" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">FPS: 60 Locked</text>
  <text x="680" y="460" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">Gaming</text>
</svg>
